# California Benefits Programs — Eligibility Rules
# Version: 2.0.0 | Last Updated: 2026-10-21 | FPL Year: 2026
#
# Every threshold cites its source and effective dates. CBOs can verify.
# A program or table marked verified: false is never screened: the engine
#   answers "not screened" with the stated reason and uses no number from it.
# Update schedule: poverty guidelines (mid-January), SSI and CalEITC (January),
#   WIC and school meals (July 1), CalWORKs MBSAC (July 1) and MAP (October 1),
#   CARE, FERA and California LifeLine (June 1), child care ceilings (July 1),
#   CalFresh/SNAP (October 1), LIHEAP (October), HUD Section 8 income limits
#   (spring; FY2026 took effect May 1, 2026), all others on legislative change.

